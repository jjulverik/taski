volumes:
  pg_data:
  static:

services:
  db:
    image: postgres:13.10
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
  backend:
    image: julverikk/taski_backend:latest
    env_file: .env
    volumes:
      - static:/backend_static
  frontend:
    env_file: .env
    image: julverikk/taski_frontend:latest
    command: sh -c "mkdir -p /frontend_static && cp -r /app/build/. /frontend_static/"
    volumes:
      - static:/frontend_static
  gateway:
    image: julverikk/taski_gateway:latest
    volumes:
      - static:/staticfiles
    ports:
      - 8000:80