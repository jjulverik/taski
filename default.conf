server { listen 80; index index.html; location /api/ { proxy_set_header Host $host; proxy_pass http://taski-fresh-backend-1:8000/api/; } location /admin/ { proxy_set_header Host $host; proxy_pass http://taski-fresh-backend-1:8000/admin/; } location /media/ { alias /media/; } location /static/ { alias /staticfiles/static/; } location / { root /staticfiles; try_files $uri $uri/ /index.html; } }
